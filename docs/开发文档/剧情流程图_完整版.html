      graph.updateItem(node, {
        style: {
          shadowColor: '#667eea',
          shadowBlur: 20
        }
      });

        graph.updateItem(node, {
          style: {

            shadowBlur: 10
          }
        });
      }, 500);
    });

    // 鼠标悬停效果

      const node = evt.item;
      graph.updateItem(node, {
        style: {
          lineWidth: 4,
          stroke: '#667eea'
        }
      });
    });

    graph.on('node:mouseleave', (evt) => {
      const node = evt.item;
      const model = node.getModel();
      graph.updateItem(node, {
        style: {
          lineWidth: model.style.lineWidth || 2,
          stroke: model.style.stroke
        }
      });
    });

      graph.changeSize(document.getElementById('container').offsetWidth, 1200);
